<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Flask App</title>
</head>
<body>
    <h1>Movie Reviewer (Rebranding Soon)</h1>
    <p>Share ratings and reviews of all your favorite movies!</p>
    <button id="loadBtn">Load Movies</button>
    <table id="myTable"></table>
    <script src="/static/app.js"></script>
    <form action="{{ url_for('view2') }}" method="post">
        <button type="submit">Make Review</button>
    </form>
    <section>
        <h2>Contact Form</h2>
        <form id="contactForm">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="topic">Topic</label>
            <select id="topic" name="topic">
                <option value="general">General question</option>
                <option value="support">Support</option>
                <option value="feedback">Feedback</option>
            </select>

            <label for="message-text">Message</label>
            <textarea id="message-text" name="message" rows="5" placeholder="Write your message..."></textarea>

            <div class="button-row">
                <button type="submit" class="btn-primary">Submit</button>
                <button type="reset" class="btn-secondary">Clear</button>
                <button type="button" class="btn-danger" id="cancelBtn">Cancel</button>
            </div>
        </form>
        <p id="message"></p>
    </section>
</body>
</html>
